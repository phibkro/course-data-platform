name: PR preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix develop --command bun install --frozen-lockfile
      - run: nix develop --command bun run validate
      - id: deploy
        run: nix develop --command bun run deploy:preview -- "${{ github.event.pull_request.number }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Publish Preview URL
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          BODY="$(cat <<EOF
          <!-- course-lens-preview -->
          ## Preview ready

          **Open the app:** $WEB_URL

          API: $API_URL

          Built from commit [\`$SHORT_SHA\`]($SOURCE_URL).

          _This comment updates on every push and is removed when the pull request closes._
          EOF
          )"
          COMMENT_ID="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- course-lens-preview -->")) | .id' | tail -n 1)"
          if [[ -n "$COMMENT_ID" ]]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
          fi
        env:
          API_URL: ${{ steps.deploy.outputs.api_url }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_URL: ${{ steps.deploy.outputs.source_url }}
          WEB_URL: ${{ steps.deploy.outputs.web_url }}

  cleanup:
    if: >-
      always() &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.PREVIEW_DEPLOYMENTS_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: DeterminateSystems/nix-installer-action@v20
      - run: nix develop --command bun install --frozen-lockfile
      - name: Delete Worker Previews
        run: |
          apps/course-api/node_modules/.bin/wrangler preview delete --config infra/previews/course-api.wrangler.json --name "$PREVIEW_NAME" --skip-confirmation
          apps/course-api/node_modules/.bin/wrangler preview delete --config infra/previews/student-web.wrangler.json --name "$PREVIEW_NAME" --skip-confirmation
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PREVIEW_NAME: pr-${{ github.event.pull_request.number }}
      - name: Remove Preview comment
        run: |
          COMMENT_IDS="$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- course-lens-preview -->")) | .id')"
          while IFS= read -r COMMENT_ID; do
            [[ -z "$COMMENT_ID" ]] || gh api --method DELETE "repos/$GITHUB_REPOSITORY/issues/comments/$COMMENT_ID"
          done <<< "$COMMENT_IDS"
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
